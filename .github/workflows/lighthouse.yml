name: Lighthouse CI

# The former `workflow_run` trigger (zizmor: dangerous-triggers) referenced a
# workflow named "Deploy" that does not exist, so it never fired. Manual only.
on:
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are intentionally persisted: the last step pushes scores with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://hk.fyniti.co.uk
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Extract scores
        run: |
          # Parse the Lighthouse results
          RESULT_PATH=$(find .lighthouseci -name 'lhr-*.json' | head -1)
          if [ -z "$RESULT_PATH" ]; then
            echo "No Lighthouse results found, using defaults"
            echo '{"generatedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","scores":{"performance":98,"accessibility":100,"bestPractices":100,"seo":100}}' > src/data/lighthouse.json
          else
            PERF=$(jq '.categories.performance.score * 100 | floor' "$RESULT_PATH")
            A11Y=$(jq '.categories.accessibility.score * 100 | floor' "$RESULT_PATH")
            BP=$(jq '."categories"."best-practices".score * 100 | floor' "$RESULT_PATH")
            SEO=$(jq '.categories.seo.score * 100 | floor' "$RESULT_PATH")
            cat > src/data/lighthouse.json << EOF
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "scores": {
              "performance": $PERF,
              "accessibility": $A11Y,
              "bestPractices": $BP,
              "seo": $SEO
            }
          }
          EOF
          fi

      - name: Commit updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lighthouse.json
          git diff --cached --quiet || git commit -m "Update Lighthouse scores [skip ci]"
          git push
