<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;fill:#e6edf3}
.k{fill:#00bfbf;font-size:14px;letter-spacing:3px}
.t{fill:#a9fef7;font-size:44px;font-weight:700;letter-spacing:5px}
.s{fill:#7d8590;font-size:16px;letter-spacing:1px}
.h{fill:#a9fef7;font-size:28px;font-weight:700;letter-spacing:3px}
.b{font-size:15px}
.d{fill:#7d8590;font-size:14px}
.chip{fill:#00bfbf;font-size:13px;font-weight:700;letter-spacing:1px}
.v{fill:#a9fef7;font-size:40px;font-weight:700}
.card{fill:#0f1b20;stroke:#1f3a40;stroke-width:1.5}
.fade{animation:fade .9s ease-out backwards}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 2.6s ease-in-out infinite alternate}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.rspin{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite reverse}
.draw{stroke-dasharray:900;animation:draw 3s ease-out infinite alternate}
.scan{animation:scan 7s linear infinite}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes grow{from{transform:scaleX(.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:900}}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(1536px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
