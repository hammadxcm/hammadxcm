<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" role="img" aria-labelledby="title desc">
<title id="title">Engineering Philosophy — hammadxcm</title>
<desc id="desc">Animated panel of Hammad Khan’s engineering signals and five principles: clarity, scale, security, performance and automation.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;fill:#e6edf3}
.k{fill:#00bfbf;font-size:14px;letter-spacing:3px}
.t{fill:#a9fef7;font-size:44px;font-weight:700;letter-spacing:5px}
.s{fill:#7d8590;font-size:16px;letter-spacing:1px}
